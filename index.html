<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>不満発電タービン</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="game-container">
        <h1>⚡ 不満発電所 ⚡</h1>
        
        <div class="turbine-container-3d">
    <div id="turbine" class="turbine-3d">
        <div class="core-3d"></div>
        <div class="blade-3d b1"></div>
        <div class="blade-3d b2"></div>
        <div class="blade-3d b3"></div>
        <div class="blade-3d b4"></div>
        <div class="blade-3d b5"></div>
        <div class="blade-3d b6"></div>
        <div class="blade-3d b7"></div>
        <div class="blade-3d b8"></div>
    </div>
    
    <div id="lightning-effect" class="lightning-3d"></div>
</div>

        <div class="input-area">
            <textarea id="fumanInput" placeholder="上司への怒り、日常の不満を注入せよ..."></textarea>
            <button id="chargeBtn">不満を注入（発電開始）</button>
        </div>

        <div class="output-area">
            <h3>🔋 変換されたポジティブエネルギー:</h3>
            <p id="meigenOutput">ここに名言が出力されます</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
